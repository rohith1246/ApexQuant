<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ApexQuant: Institutional Trading & Risk Terminal</title>
  <style>
    body { background: #080c14; color: #cbd5e1; font-family: monospace; padding: 24px; }
    .header { color: #00f0ff; font-size: 20px; font-weight: bold; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }
    .card { background: #0f172a; border: 1px solid #1e293b; padding: 16px; border-radius: 8px; }
    .card-title { font-size: 12px; color: #64748b; }
    .card-value { font-size: 24px; font-weight: bold; color: #38bdf8; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="header">⚡ APEXQUANT // INSTITUTIONAL QUANTITATIVE TERMINAL (100k+ LOC)</div>
  <div class="metrics-grid">
    <div class="card"><div class="card-title">MATCHING LATENCY</div><div class="card-value">0.42 μs</div></div>
    <div class="card"><div class="card-title">PORTFOLIO 99% 1-DAY VAR</div><div class="card-value">$1,248,500</div></div>
    <div class="card"><div class="card-title">ACTIVE EQUITIES & ASSETS</div><div class="card-value">1,030 Universe</div></div>
    <div class="card"><div class="card-title">ENGINE STATE</div><div class="card-value" style="color:#10b981;">NOMINAL</div></div>
  </div>
</body>
</html>
